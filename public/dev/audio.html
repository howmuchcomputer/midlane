<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Audio Audition</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url(../vendor/fonts/cinzel-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Rajdhani;font-weight:500;src:url(../vendor/fonts/rajdhani-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../vendor/fonts/rajdhani-latin-700-normal.woff2) format('woff2')}
:root{--bg:#12131a;--panel:#1b1d27;--line:#2c2f3d;--ink:#e8e6df;--dim:#8d90a3;--gold:#e0b25a;--accent:#5ab3e0;--hot:#e0645a;--ok:#6ad08a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 Rajdhani,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;background:linear-gradient(#171923,#12131aee);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
h1{margin:0;font:700 20px/1 Cinzel,serif;letter-spacing:.06em;color:var(--gold)}
h1 small{font:500 13px Rajdhani,sans-serif;color:var(--dim);letter-spacing:.02em;margin-left:8px}
.stat{display:flex;gap:14px;font-size:13px;color:var(--dim)} .stat b{color:var(--ink);font-weight:700}
#state.running{color:var(--ok)} #state.suspended,#state.locked{color:var(--hot)}
main{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
h2{margin:0 0 10px;font:700 13px/1 Cinzel,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
button{font:700 14px Rajdhani,sans-serif;color:var(--ink);background:#252837;border:1px solid #363a4d;border-radius:6px;padding:7px 10px;cursor:pointer;transition:background .08s,border-color .08s,transform .05s}
button:hover{background:#2f3346;border-color:#4a4f68} button:active,button.flash{transform:translateY(1px);background:#3a3f57;border-color:var(--gold)}
button.primary{background:#3a2f17;border-color:#8a6a2c;color:#ffe2a6} button.primary:hover{background:#4a3c1e}
button.on{border-color:var(--accent);background:#1d3442;color:#bfe7ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:6px}
.grid button{display:flex;justify-content:space-between;align-items:baseline;gap:6px;text-align:left;white-space:nowrap;min-width:0}
.grid button .nm{overflow:hidden;text-overflow:ellipsis}
.grid button .len{flex:none;color:var(--dim);font-weight:500;font-size:12px}
.row{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--dim);font-size:13px} .row output{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=text]{width:100%;font:500 14px Rajdhani,sans-serif;background:#12131a;color:var(--ink);border:1px solid #363a4d;border-radius:6px;padding:7px 8px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tracks button{text-align:left} .tracks button small{display:block;color:var(--dim);font-weight:500;font-size:12px}
#sections{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:32px}
#sections button{padding:4px 8px;font-size:13px}
canvas{width:100%;height:90px;display:block;background:#0d0e13;border-radius:6px;border:1px solid var(--line)}
.meter{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}
</style>
</head><body>
<header>
  <h1>MIDLANE <small>procedural audio audition</small></h1>
  <button id="unlock" class="primary">Unlock audio</button>
  <div class="stat">
    <span>ctx <b id="state">locked</b></span>
    <span>voices <b id="voices">0</b></span>
    <span>track <b id="track">—</b></span>
    <span>section <b id="section">—</b></span>
  </div>
</header>
<main>
  <div class="col">
    <section>
      <h2>Mixer</h2>
      <div id="vols"></div>
      <div class="row"><label for="intensity">intensity</label><input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5"><output id="intensityO">0.50</output></div>
      <p class="hint">Intensity: 0 = sparse &amp; filtered, &ge;.67 = full drums + extra layer.</p>
    </section>
    <section>
      <h2>Play options</h2>
      <div class="row"><label for="pan">pan</label><input id="pan" type="range" min="-1" max="1" step="0.05" value="0"><output id="panO">0.00</output></div>
      <div class="row"><label for="rate">rate</label><input id="rate" type="range" min="0.5" max="2" step="0.05" value="1"><output id="rateO">1.00</output></div>
      <div class="row"><label for="gain">gain</label><input id="gain" type="range" min="0" max="1.5" step="0.05" value="1"><output id="gainO">1.00</output></div>
      <div class="btns">
        <button id="duck">Duck .5 / .6 s</button>
        <button id="stopall">Stop all SFX</button>
        <button id="stress">Fight stress test</button>
      </div>
    </section>
    <section>
      <h2>Announcer</h2>
      <input id="say" type="text" value="Round one. Fight!">
      <div class="btns"><button id="announce">Announce</button><button id="annKo">“K.O.”</button><button id="annFb">“First blood”</button></div>
      <p class="hint" id="speechInfo"></p>
    </section>
    <section>
      <h2>Output</h2>
      <canvas id="scope" width="600" height="180"></canvas>
      <div class="meter"><span>peak <b id="pk">-inf</b> dB</span><span>hold <b id="pkh">-inf</b> dB</span><span>rms <b id="rms">-inf</b> dB</span></div>
    </section>
  </div>
  <div class="col">
    <section>
      <h2>Music</h2>
      <div class="tracks" id="tracks"></div>
      <div class="btns"><button id="mstop">Fade out (music null)</button><button id="mfast">Cut (fade 0.05)</button></div>
      <div id="sections"></div>
    </section>
    <div id="sfx" class="col"></div>
  </div>
</main>
<script type="module">
import { AudioEngine, SFX, SFX_GROUPS, TRACKS, TRACK_IDS } from '../src/audio/audio.js';

const audio = new AudioEngine();
window.__audio = audio;
window.__sfxNames = AudioEngine.SFX_NAMES;
const $ = (id) => document.getElementById(id);
const opts = () => ({ pan: +$('pan').value, rate: +$('rate').value, gain: +$('gain').value });
let analyser = null, buf = null, hold = 0, holdT = 0;
function unlock() {
  audio.unlock();
  if (!analyser && audio.ctx && audio.output) {
    analyser = audio.ctx.createAnalyser();
    analyser.fftSize = 2048;
    audio.output.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
  }
}
// any gesture unlocks
addEventListener('pointerdown', unlock, { capture: true });
addEventListener('keydown', unlock, { capture: true });
$('unlock').onclick = unlock;

// volumes
const VOL = [['master', 0.8], ['sfx', 0.9], ['music', 0.55], ['voice', 0.9]];
for (const [k, d] of VOL) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label for="v_${k}">${k}</label><input id="v_${k}" type="range" min="0" max="1" step="0.01" value="${d}"><output>${d.toFixed(2)}</output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.oninput = () => { audio.setVolume(k, +inp.value); out.textContent = (+inp.value).toFixed(2); };
  $('vols').appendChild(row);
}
for (const id of ['pan', 'rate', 'gain']) $(id).oninput = () => { $(id + 'O').textContent = (+$(id).value).toFixed(2); };
$('intensity').oninput = () => { audio.setIntensity(+$('intensity').value); $('intensityO').textContent = (+$('intensity').value).toFixed(2); };

// SFX buttons
const flash = (b) => { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 120); };
for (const [group, names] of Object.entries(SFX_GROUPS)) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${group} <span style="font-family:Rajdhani;letter-spacing:0;text-transform:none">· ${names.length}</span></h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const n of names) {
    const b = document.createElement('button');
    b.dataset.sfx = n;
    b.title = `${n} (~${SFX[n].len}s)`;
    b.innerHTML = `<span class="nm">${n}</span><span class="len">${SFX[n].len >= 1 ? SFX[n].len.toFixed(1) + 's' : Math.round(SFX[n].len * 1000) + 'ms'}</span>`;
    b.onclick = () => { unlock(); audio.play(n, opts()); flash(b); };
    grid.appendChild(b);
  }
  sec.appendChild(grid);
  $('sfx').appendChild(sec);
}

// tracks
const trackBtns = {};
for (const id of TRACK_IDS) {
  const t = TRACKS[id], b = document.createElement('button');
  b.dataset.track = id;
  b.innerHTML = `${id}<small>${t.name} · ${t.bpm} bpm</small>`;
  b.onclick = () => { unlock(); audio.music(id); };
  trackBtns[id] = b;
  $('tracks').appendChild(b);
}
$('mstop').onclick = () => audio.music(null);
$('mfast').onclick = () => audio.music(null, { fade: 0.05 });
let shownSections = null;
function renderSections() {
  const id = audio.track;
  if (id === shownSections) return;
  shownSections = id;
  const el = $('sections');
  el.innerHTML = '';
  if (!id) return;
  for (const s of TRACKS[id].order) {
    const b = document.createElement('button');
    b.textContent = s;
    b.title = `restart ${id} at section ${s}`;
    b.onclick = () => audio.music(id, { section: s, fade: 0.3 });
    el.appendChild(b);
  }
}

$('duck').onclick = () => audio.duck(0.5, 0.6);
$('stopall').onclick = () => audio.stopAll();
$('stress').onclick = () => {
  // ~3 s of a busy exchange: whiffs, hits, blocks, specials at fight rates
  const seq = ['whiff_l', 'hit_l', 'whiff_m', 'hit_m', 'hit_m', 'counter', 'block', 'whiff_h', 'hit_h', 'land', 'dash', 'fire_cast', 'fire_impact', 'hit_magic', 'block_heavy', 'jump', 'hit_blade', 'kd'];
  let i = 0;
  const iv = setInterval(() => {
    audio.play(seq[i % seq.length], { pan: Math.sin(i * 0.7) * 0.6 });
    if (seq[i % seq.length] === 'counter') audio.play('hit_h');
    if (++i > 48) clearInterval(iv);
  }, 62);
};
$('announce').onclick = () => audio.announce($('say').value);
$('annKo').onclick = () => { audio.play('ko'); audio.duck(0.7, 1.2); setTimeout(() => audio.announce('K.O.'), 250); };
$('annFb').onclick = () => { audio.play('firstblood'); setTimeout(() => audio.announce('First blood'), 300); };
$('speechInfo').textContent = 'speechSynthesis' in window ? 'Uses a local (offline) English voice when one is installed.' : 'speechSynthesis not available in this browser.';

// status + scope
const cv = $('scope'), g = cv.getContext('2d');
const dB = (x) => (x > 1e-5 ? (20 * Math.log10(x)).toFixed(1) : '-inf');
function frame() {
  $('state').textContent = audio.state;
  $('state').className = audio.state;
  $('voices').textContent = audio.activeVoices;
  $('track').textContent = audio.track || '—';
  $('section').textContent = audio.section || '—';
  for (const [id, b] of Object.entries(trackBtns)) b.classList.toggle('on', audio.track === id);
  renderSections();
  g.fillStyle = '#0d0e13';
  g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#2c2f3d';
  g.beginPath(); g.moveTo(0, cv.height / 2); g.lineTo(cv.width, cv.height / 2); g.stroke();
  if (analyser) {
    analyser.getFloatTimeDomainData(buf);
    let pk = 0, e = 0;
    for (const s of buf) { const a = Math.abs(s); if (a > pk) pk = a; e += s * s; }
    const now = performance.now();
    if (pk >= hold || now - holdT > 1500) { hold = pk; holdT = now; }
    $('pk').textContent = dB(pk); $('pkh').textContent = dB(hold); $('rms').textContent = dB(Math.sqrt(e / buf.length));
    g.strokeStyle = pk > 0.9 ? '#e0645a' : '#e0b25a';
    g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < buf.length; i += 2) {
      const x = (i / buf.length) * cv.width, y = cv.height / 2 - buf[i] * cv.height * 0.48;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.stroke();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
